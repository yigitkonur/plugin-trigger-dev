name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: "Release now: auto (from commits), patch, minor or major"
        default: auto
        type: choice
        options: [auto, patch, minor, major]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rule fixtures, guard and detect tests
        run: |
          node tests/rules.test.mjs
          node tests/guard.test.mjs
          node tests/detect.test.mjs
          node tests/seed.test.mjs
          node tests/replay.test.mjs
          node tests/marker.test.mjs
      - name: Generated files are up to date
        run: |
          node scripts/build-hooks.mjs --check
          node scripts/rules/build.mjs
          node scripts/rules/render-catalog.mjs
          git diff --exit-code -- scripts/rules/rules.json references/rule-catalog.md
      - name: Skill and agent frontmatter parses
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/ci/check-frontmatter.py
      - name: Templates typecheck against the latest SDK
        run: |
          mkdir /tmp/tc && cp -R skills/init/templates/. /tmp/tc/ && cd /tmp/tc
          echo '{"name":"tc","private":true,"type":"module"}' > package.json
          echo '{"compilerOptions":{"target":"ES2022","module":"ESNext","moduleResolution":"Bundler","strict":true,"jsx":"react-jsx","esModuleInterop":true,"skipLibCheck":true,"noEmit":true,"types":[]},"include":["manual-config.ts","polyglot-subpackage/src","polyglot-subpackage/trigger.config.ts","realtime"]}' > tsconfig.json
          npm i --silent --no-audit --no-fund @trigger.dev/sdk@latest @trigger.dev/build@latest @trigger.dev/react-hooks@latest react@19 @types/react@19 typescript@5
          npx tsc -p tsconfig.json
      - name: Plugin spec validates
        run: |
          npm i -g @anthropic-ai/claude-code
          claude plugin validate --strict .
  # Installed copies update when the version string changes, so every merge that changes what the plugin ships cuts a release:
  # bump both manifests, add a CHANGELOG section, tag v<version> and <name>--v<version>, publish a GitHub release.
  release:
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(release)')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bump, commit and tag (skipped when nothing shipped changed)
        id: rel
        run: |
          bump="${{ github.event.inputs.bump }}"
          if [ -n "$bump" ] && [ "$bump" != "auto" ]; then node scripts/ci/release.mjs --execute --bump "$bump"; else node scripts/ci/release.mjs --execute; fi
      - name: Push the release commit and tags
        if: steps.rel.outputs.release == 'true'
        run: |
          git push origin HEAD:main --follow-tags || { git pull --rebase origin main && git push origin HEAD:main --follow-tags; }
          git push origin "${{ steps.rel.outputs.name }}--${{ steps.rel.outputs.tag }}"
      - name: GitHub release
        if: steps.rel.outputs.release == 'true'
        run: |
          v="${{ steps.rel.outputs.version }}"
          awk -v v="$v" '$0 ~ "^## "v"( |$)" {f=1; next} /^## / {f=0} f' CHANGELOG.md > /tmp/notes.md
          { printf '**install** (from your terminal): `claude plugin install %s --marketplace %s`\n\n' "${{ steps.rel.outputs.name }}" "${{ github.repository }}"; cat /tmp/notes.md; } > /tmp/release.md
          gh release create "${{ steps.rel.outputs.tag }}" --title "${{ steps.rel.outputs.name }} $v" --notes-file /tmp/release.md --verify-tag
